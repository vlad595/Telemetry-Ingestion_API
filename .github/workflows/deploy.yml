
name: Deploy Ingestion API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Central Deploy
        env:
          GH_TOKEN: ${{ secrets.CENTRAL_DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/vlad595/Telemetry-Auth_API/actions/workflows/deploy-central.yml/dispatches" \
            -d '{"ref":"main","inputs":{"service":"ingestion-api"}}'
